name: Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0)"
        required: true
      message:
        description: "Tag message"
        required: true

permissions:
  contents: read

jobs:
  create-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Mint GitHub App token (wildbit-ci)
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.WILDBIT_CI_APP_ID }}
          private-key: ${{ secrets.WILDBIT_CI_APP_KEY }}
          owner: wildbitca
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Create and push annotated tag
        env:
          VERSION: ${{ github.event.inputs.version }}
          MESSAGE: ${{ github.event.inputs.message }}
          GIT_AUTHOR: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name "${GIT_AUTHOR}[bot]"
          git config user.email "${GIT_AUTHOR}[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$MESSAGE"
          git push origin "$VERSION"
